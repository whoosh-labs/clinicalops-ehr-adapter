[project]
name = "clinicalops-ehr-adapter"
version = "0.1.0"
description = "Normalizes raw EHR schedule / eligibility exports into canonical VOB import CSV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11.4",
    "pandas>=2.2.3",
    "lxml>=5.3.0",
    "openpyxl>=3.1.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Streamlit UI (app.py), kept until every tenant is cut over to the service.
ui = ["streamlit>=1.39.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.0",
    "ruff>=0.7.4",
    "reportlab>=4.2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ehr_adapter"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["app.py"]  # Streamlit UI, inherited as-is

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# Moved verbatim from PDFTOCSV; kept byte-for-byte in behaviour, so its style is not reworked.
"ehr_adapter/pipelines/*" = ["E701", "E702", "E741", "B023", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
